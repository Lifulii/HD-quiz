<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>青年理论知识学习竞赛·刷题练习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 密码解锁页 -->
  <section id="view-lock" class="view hidden">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 class="lock-title">内部题库 · 需密码访问</h2>
      <p class="lock-tip">请输入密码</p>
      <input id="lock-input" class="lock-input" type="password" placeholder="访问密码" autocomplete="off">
      <button id="lock-btn" class="confirm-btn">解锁进入</button>
      <p id="lock-error" class="lock-error hidden">密码不正确，请重试</p>
    </div>
  </section>

  <!-- 首页 -->
  <section id="view-home" class="view">
    <header class="home-header">
      <h1>青年理论知识网络学习竞赛</h1>
      <p class="subtitle">题库（第二期）· 共 580 题</p>
      <div class="stat-cards">
        <div class="stat-card"><span id="stat-done" class="stat-num">0</span><span class="stat-label">已练习</span></div>
        <div class="stat-card"><span id="stat-rate" class="stat-num">0%</span><span class="stat-label">正确率</span></div>
        <div class="stat-card"><span id="stat-wrong" class="stat-num">0</span><span class="stat-label">错题</span></div>
        <div class="stat-card"><span id="stat-fav" class="stat-num">0</span><span class="stat-label">收藏</span></div>
      </div>
    </header>

    <div class="mode-bar">
      <span class="mode-label">刷题顺序</span>
      <div class="seg" id="order-seg">
        <button data-order="seq" class="seg-btn active">顺序</button>
        <button data-order="rand" class="seg-btn">随机</button>
      </div>
    </div>

    <div id="part-list" class="part-list"></div>

    <div class="quick-entries">
      <button id="entry-wrong" class="entry-btn wrong">📕 错题本</button>
      <button id="entry-fav" class="entry-btn fav">⭐ 收藏夹</button>
    </div>
    <p class="home-tip">做题记录自动保存在本机浏览器，请勿清除站点数据</p>
  </section>

  <!-- 刷题页 -->
  <section id="view-quiz" class="view hidden">
    <header class="quiz-header">
      <button id="btn-back" class="back-btn">‹ 返回</button>
      <div class="quiz-title-wrap">
        <div id="quiz-title" class="quiz-title"></div>
        <div id="quiz-progress" class="quiz-progress"></div>
      </div>
      <button id="btn-fav" class="fav-btn" title="收藏">☆</button>
    </header>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>

    <main class="quiz-body">
      <div id="q-type-tag" class="q-type-tag"></div>
      <div id="q-stem" class="q-stem"></div>
      <div id="q-options" class="q-options"></div>
      <button id="btn-confirm" class="confirm-btn hidden">确认答案</button>

      <div id="feedback" class="feedback hidden">
        <div id="fb-verdict" class="fb-verdict"></div>
        <div class="fb-block">
          <div class="fb-title">正确答案</div>
          <div id="fb-answer" class="fb-answer"></div>
        </div>
        <div class="fb-block">
          <div class="fb-title">📖 解析</div>
          <div id="fb-explanation" class="fb-text"></div>
        </div>
        <div class="fb-block detail-block hidden" id="fb-detail-block">
          <div class="fb-title">📚 知识点详解</div>
          <div id="fb-detail" class="fb-text detail"></div>
        </div>
        <div class="fb-block mnemonic-block">
          <div class="fb-title">🧠 记忆口诀</div>
          <div id="fb-mnemonic" class="fb-text mnemonic"></div>
        </div>
      </div>
    </main>

    <footer class="quiz-footer">
      <button id="btn-prev" class="nav-btn">‹ 上一题</button>
      <button id="btn-jump" class="nav-btn jump">☰ 题号</button>
      <button id="btn-next" class="nav-btn primary">下一题 ›</button>
    </footer>
  </section>

  <!-- 结果页 -->
  <section id="view-result" class="view hidden">
    <div class="result-wrap">
      <div class="result-card">
        <div id="rs-rate" class="rs-rate">0%</div>
        <div id="rs-title" class="rs-sub">本次正确率</div>
        <div class="rs-row">
          <div><b id="rs-done">0</b><span>完成</span></div>
          <div><b id="rs-right" class="g">0</b><span>答对</span></div>
          <div><b id="rs-wrong" class="r">0</b><span>答错</span></div>
        </div>
        <p id="rs-tip" class="rs-tip"></p>
        <div class="rs-btns">
          <button id="btn-r-home" class="nav-btn">返回首页</button>
          <button id="btn-r-wrong" class="nav-btn primary">重练错题</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 题号选择面板 -->
  <div id="jump-mask" class="jump-mask hidden">
    <div class="jump-box">
      <div class="jump-head"><span id="jump-title"></span><button id="jump-close">✕</button></div>
      <div class="jump-legend">
        <span><i class="dot g"></i>答对</span>
        <span><i class="dot r"></i>答错</span>
        <span><i class="dot n"></i>未答</span>
        <span class="jump-legend-right">当前题有红框标记</span>
      </div>
      <div id="jump-grid" class="jump-grid"></div>
    </div>
  </div>

  <!-- 空列表提示 -->
  <div id="toast" class="toast hidden"></div>
</div>

<script src="data/questions.enc.js"></script>
<script src="app.js"></script>
</body>
</html>
